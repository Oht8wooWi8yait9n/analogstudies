name: Update Analog Studies Mirror & Sitemap

on:
  schedule:
    # Run weekly on Sunday at 05:30 UTC
    - cron: '30 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  harvest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Harvest SignalR + Angular bundle and generate pre-rendered HTML mirror
        run: |
          python3 generate_analogstudies_sitemap.py

      - name: Commit and push changes if content changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            DAYS_SINCE_COMMIT=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
            if [ "$DAYS_SINCE_COMMIT" -ge 45 ]; then
              echo "No sitemap changes, but last commit was ${DAYS_SINCE_COMMIT} days ago (>= 45d). Pushing empty keepalive commit."
              git commit --allow-empty -m "chore(ci): 45-day keepalive to prevent GitHub Actions 60-day schedule auto-disable [skip ci]"
              git push
            else
              echo "No changes detected. Skipping commit. (last commit ${DAYS_SINCE_COMMIT}d ago)."
            fi
          else
            git commit -m "chore: update analogstudies.jsc.nasa.gov mirror and sitemap [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && break
              sleep 5
            done
          fi
